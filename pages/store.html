<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaMart — Live store · TraceZero</title>
<meta name="description" content="A real storefront running on the TraceZero-protected checkout API. Break it and watch it heal.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23F64302'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/static/tw.js"></script>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@600..900&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/site.css">
<style>details[open] .chev { transform: rotate(180deg); } summary::-webkit-details-marker { display: none; }</style>
</head>
<body data-nav-overlay="true" class="text-black">
<div id="site-nav"></div>

<div data-theme="light" class="bg-pale min-h-screen pt-[76px]">
  <!-- demo strip -->
  <div class="mx-2 sm:mx-3 rounded-xl bg-black text-white px-4 py-3 flex flex-wrap items-center gap-x-4 gap-y-1 text-[12px]">
    <span class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-accent pulse-dot"></span><b class="font-semibold tracking-wide">LIVE DEMO</b></span>
    <span class="text-white/60">Checkout calls the real API behind TraceZero. Try an empty cart.</span>
    <a href="/warroom" target="_blank" class="ml-auto text-white hover:text-accent transition-colors">Watch the War Room →</a>
  </div>

  <!-- header -->
  <header data-reveal data-reveal-on="ready" class="px-4 sm:px-6 lg:px-10 pt-14 pb-10 flex flex-col md:flex-row md:items-end justify-between gap-6">
    <div>
      <p class="r-up eyebrow-dark" style="--d:100ms">NovaMart · demo store</p>
      <h1 class="r-up font-bubbledot text-4xl sm:text-6xl lg:text-7xl leading-[.95] tracking-tight mt-6" style="--d:200ms">Merch for<br>people who ship.</h1>
    </div>
    <div class="r-up max-w-xs text-xs sm:text-sm text-black/60 leading-relaxed" style="--d:350ms">
      Free shipping when your average item is $50+. Codes:
      <span class="inline-flex gap-1.5 mt-2 flex-wrap">
        <span class="px-2 py-1 rounded-md bg-white text-black text-[11px]">LAUNCH10</span>
        <span class="px-2 py-1 rounded-md bg-white text-black text-[11px]">VIP20</span>
        <span class="px-2 py-1 rounded-md bg-white text-black text-[11px]">HACKER15</span>
      </span>
    </div>
  </header>

  <main class="px-2 sm:px-3 pb-3 grid lg:grid-cols-[1fr_380px] gap-2 sm:gap-3">
    <section data-reveal aria-label="Products"><div id="catalog" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-2 sm:gap-3"></div></section>

    <aside class="lg:sticky lg:top-[88px] h-fit space-y-2 sm:space-y-3" aria-label="Cart">
      <div class="bg-white rounded-2xl p-5 sm:p-6">
        <div class="flex items-baseline justify-between"><h2 class="text-lg font-semibold">Cart</h2><span id="cartCount" class="text-xs text-black/40">0 items</span></div>
        <div id="cartLines" class="mt-5 space-y-3"></div>
        <label for="coupon" class="block mt-6 text-[11px] uppercase tracking-[.2em] text-black/40">Coupon</label>
        <input id="coupon" placeholder="launch10" autocomplete="off" class="mt-2 w-full px-3.5 py-2.5 rounded-xl bg-card border border-transparent focus:border-black outline-none text-sm">
        <div class="mt-5 flex items-center justify-between text-sm"><span class="text-black/50">Subtotal</span><span id="estSub" class="font-semibold">$0.00</span></div>
        <button id="checkoutBtn" class="cta w-full mt-5 justify-between !pr-5"><span class="flex items-center gap-3.5"><span class="chip"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span><span id="checkoutLabel">Checkout</span></span><span id="checkoutTotal" class="text-white/60 text-xs"></span></button>
      </div>

      <details class="bg-white rounded-2xl group">
        <summary class="cursor-pointer list-none px-5 sm:px-6 py-4 flex items-center justify-between text-sm font-medium">Developer tools <svg class="chev w-4 h-4 text-black/40 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
        <div class="px-5 sm:px-6 pb-5 space-y-4">
          <label class="flex items-start gap-3 cursor-pointer select-none">
            <input id="partnerMode" type="checkbox" class="peer sr-only">
            <span class="mt-0.5 w-10 h-6 shrink-0 rounded-full bg-card peer-checked:bg-accent relative transition after:content-[''] after:absolute after:top-1 after:left-1 after:w-4 after:h-4 after:rounded-full after:bg-white after:shadow after:transition peer-checked:after:translate-x-4"></span>
            <span class="text-[13px] text-black/70 leading-snug">Simulate partner API<span class="block text-[11px] text-black/40 mt-0.5">sends "coupon_code": null</span></span>
          </label>
          <div>
            <div class="text-[11px] uppercase tracking-[.2em] text-black/40 mb-2">Last request</div>
            <pre id="raw" class="bg-black text-white/70 rounded-xl p-3 text-[10.5px] leading-relaxed max-h-56 overflow-auto scroll whitespace-pre-wrap">No request yet.</pre>
          </div>
        </div>
      </details>
    </aside>
  </main>
</div>

<!-- result modal -->
<div id="resultModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm grid place-items-center p-4" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
  <div id="resultCard" class="animate-scale-in bg-white text-black rounded-2xl w-full max-w-md p-6 sm:p-7 relative"></div>
</div>

<div id="site-footer"></div>
<script src="/static/site.js"></script>
<script>
const ART = { 'SKU-HOODIE': 'shirt', 'SKU-CAP': 'hard-hat', 'SKU-MUG': 'coffee', 'SKU-KEYS': 'keyboard', 'SKU-STICK': 'sticker' };
const BLURB = {
  'SKU-HOODIE': 'Heavyweight, glow-trim cuffs.', 'SKU-CAP': 'Shade for bright stack traces.',
  'SKU-MUG': '350 ml of incident coffee.', 'SKU-KEYS': 'Tactile, for 3 a.m. hotfixes.', 'SKU-STICK': '12 stickers, zero runtime errors.',
};
const CHEV = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
let catalog = {}; const cart = {};
const money = (n) => `$${Number(n).toFixed(2)}`;
const esc = tzEsc;
const $ = (id) => document.getElementById(id);

async function loadCatalog() {
  catalog = await fetch('/shop/catalog').then(r => r.json());
  $('catalog').innerHTML = Object.entries(catalog).map(([sku, p], i) => `
    <article class="r-scale bg-white rounded-2xl p-2 sm:p-2.5 flex flex-col" style="--d:${80 + i * 70}ms">
      <div class="relative h-52 rounded-xl ${i % 3 === 1 ? 'bg-black text-white' : 'bg-card text-black'} grid place-items-center overflow-hidden">
        <i data-lucide="${ART[sku] || 'package'}" class="w-16 h-16" stroke-width="1.25"></i>
        <span class="absolute top-3 left-3 text-[10px] uppercase tracking-[.2em] opacity-50">${sku.replace('SKU-', '')}</span>
        ${p.price >= 50 ? '<span class="absolute top-3 right-3 text-[10px] px-2 py-1 rounded-md bg-accent text-white">Ships free</span>' : ''}
      </div>
      <div class="p-3 sm:p-3.5 flex-1 flex flex-col">
        <div class="flex items-start justify-between gap-3"><h3 class="font-semibold text-[15px]">${esc(p.name)}</h3><span class="flex items-start gap-0.5 leading-none"><span class="text-[11px] text-black/50 mt-0.5">$</span><span class="font-bubbledot text-2xl">${p.price % 1 ? p.price.toFixed(2) : p.price}</span></span></div>
        <p class="text-xs text-black/50 mt-1.5">${esc(BLURB[sku] || '')}</p>
        <button data-add="${sku}" class="group mt-4 flex items-center justify-between gap-3 bg-card hover:bg-[#e2dee2] transition-colors rounded-xl pl-4 pr-1.5 py-1.5 text-[13px] btn" aria-label="Add ${esc(p.name)} to cart">Add to cart<span class="arrow-sq !w-9 !h-9">${CHEV}</span></button>
      </div>
    </article>`).join('');
  lucide.createIcons();
  document.querySelector('[aria-label="Products"]').classList.add('is-visible');
}
$('catalog').addEventListener('click', (e) => {
  const b = e.target.closest('[data-add]'); if (!b) return;
  cart[b.dataset.add] = (cart[b.dataset.add] || 0) + 1;
  renderCart();
  tzToast('Added to cart', catalog[b.dataset.add].name);
});

function renderCart() {
  const lines = Object.entries(cart);
  const units = lines.reduce((a, [, q]) => a + q, 0);
  const sub = lines.reduce((a, [s, q]) => a + catalog[s].price * q, 0);
  $('cartCount').textContent = `${units} item${units === 1 ? '' : 's'}`;
  $('estSub').textContent = money(sub);
  $('checkoutTotal').textContent = units ? money(sub) : 'empty cart';
  $('cartLines').innerHTML = lines.length ? lines.map(([sku, q]) => `
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg bg-card grid place-items-center shrink-0"><i data-lucide="${ART[sku]}" class="w-4 h-4"></i></div>
      <div class="min-w-0 flex-1"><div class="text-[13px] truncate">${esc(catalog[sku].name)}</div>
        <div class="text-[11px] ${q === 0 ? 'text-accent' : 'text-black/40'}">${q === 0 ? 'saved for later · qty 0' : money(catalog[sku].price * q)}</div></div>
      <div class="flex items-center rounded-lg bg-card">
        <button data-dec="${sku}" class="w-7 h-7 text-black/50 hover:text-black" aria-label="Decrease quantity">−</button><span class="w-5 text-center text-[13px]">${q}</span><button data-inc="${sku}" class="w-7 h-7 text-black/50 hover:text-black" aria-label="Increase quantity">+</button>
      </div>
      <button data-del="${sku}" class="w-7 h-7 grid place-items-center text-black/30 hover:text-black" aria-label="Remove ${esc(catalog[sku].name)}"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>`).join('') : '<p class="text-[13px] text-black/40 py-4">Your cart is empty.</p>';
  lucide.createIcons({ nodes: [$('cartLines')] });
}
$('cartLines').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.inc) cart[b.dataset.inc]++;
  if (b.dataset.dec) cart[b.dataset.dec] = Math.max(0, cart[b.dataset.dec] - 1);  // qty 0 stays as "saved for later"
  if (b.dataset.del) delete cart[b.dataset.del];
  renderCart();
});

$('checkoutBtn').onclick = async () => {
  const btn = $('checkoutBtn');
  const payload = {
    items: Object.entries(cart).map(([sku, qty]) => ({ sku, qty })),
    coupon_code: $('partnerMode').checked ? null : $('coupon').value,
  };
  btn.disabled = true; $('checkoutLabel').textContent = 'Processing…';
  let res, body;
  try {
    res = await fetch('/shop/checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    body = await res.json();
  } catch (e) { body = { error: 'NetworkError', detail: String(e) }; res = { status: 0, headers: new Headers() }; }
  btn.disabled = false; $('checkoutLabel').textContent = 'Checkout';
  $('raw').textContent = `→ POST /shop/checkout\n${JSON.stringify(payload, null, 2)}\n\n← ${res.status} · X-TraceZero: ${res.headers.get('X-TraceZero')}\n${JSON.stringify(body, null, 2)}`;
  showResult(res.status, res.headers.get('X-TraceZero'), body);
};

function showResult(status, tz, b) {
  let html;
  const badge = (txt, cls) => `<span class="inline-flex items-center gap-2 text-[11px] uppercase tracking-[.2em] px-2.5 py-1 rounded-md ${cls}">${txt}</span>`;
  if (status === 200) {
    html = `${badge('<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>200 · confirmed', 'bg-card')}
      <h3 id="resultTitle" class="mt-5 text-2xl font-semibold">Order confirmed</h3>
      <p class="text-xs text-black/40 mt-1">${esc(b.order_id)}</p>
      <div class="mt-6 space-y-2 text-[13px]">
        ${b.lines.map(l => `<div class="flex justify-between"><span>${l.qty} × ${esc(l.name)}</span><span>${money(l.line_total)}</span></div>`).join('') || '<div class="text-black/40">No items</div>'}
        <div class="border-t border-black/10 my-3"></div>
        <div class="flex justify-between text-black/50"><span>Subtotal</span><span>${money(b.subtotal)}</span></div>
        ${b.discount ? `<div class="flex justify-between text-accent"><span>Discount · ${esc(b.coupon_applied)}</span><span>−${money(b.discount)}</span></div>` : ''}
        <div class="flex justify-between text-black/50"><span>Shipping</span><span>${b.shipping ? money(b.shipping) : 'Free'}</span></div>
        <div class="flex justify-between text-black/50"><span>Tax</span><span>${money(b.tax)}</span></div>
        <div class="flex justify-between items-end pt-2"><span class="font-semibold">Total</span><span class="font-bubbledot text-4xl leading-none">${money(b.total)}</span></div>
      </div>`;
  } else if (status === 202 && tz === 'shielded') {
    html = `${badge('<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>202 · shielded', 'bg-card')}
      <h3 id="resultTitle" class="mt-5 text-2xl font-semibold">Order received</h3>
      <p class="mt-2 text-[13px] text-black/60 leading-relaxed">${esc(b.message)}</p>
      <div class="mt-6 rounded-xl bg-black text-white p-4">
        <div class="text-[11px] uppercase tracking-[.2em] text-accent">Protected by TraceZero</div>
        <p class="text-[13px] text-white/70 mt-2 leading-relaxed">This request hit a known bug. Shield <b class="text-white">${esc(b.shield)}</b> turned the crash into a graceful response while incident <b class="text-white">${esc(b.incident)}</b> heals.</p>
        <a href="/warroom" target="_blank" class="inline-block mt-3 text-[13px] text-white hover:text-accent">Watch it heal →</a>
      </div>`;
  } else {
    html = `${badge('<span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>' + status + ' · error', 'bg-red-50 text-red-700')}
      <h3 id="resultTitle" class="mt-5 text-2xl font-semibold">Something went wrong</h3>
      <p class="mt-2 text-[13px] text-black/60">This is what customers see without protection.</p>
      <pre class="mt-5 bg-card rounded-xl p-3 text-[11px] text-red-700 whitespace-pre-wrap">${esc(b.error)}: ${esc(b.detail || '')}</pre>
      ${b.incident ? `<div class="mt-3 rounded-xl bg-black text-white p-4"><p class="text-[13px] text-white/70 leading-relaxed">TraceZero opened <b class="text-white">${esc(b.incident)}</b> and is arming a shield now. Try checkout again.</p><a href="/warroom" target="_blank" class="inline-block mt-3 text-[13px] text-white hover:text-accent">Open the War Room →</a></div>` : ''}`;
  }
  const card = $('resultCard');
  card.innerHTML = `<button id="closeX" class="absolute top-4 right-4 w-9 h-9 rounded-lg grid place-items-center text-black/40 hover:text-black hover:bg-card" aria-label="Close"><i data-lucide="x" class="w-4 h-4"></i></button>${html}
    <button id="closeBtn" class="btn w-full mt-6 py-3 rounded-xl bg-card hover:bg-[#e2dee2] text-[13px] font-medium">Keep shopping</button>`;
  $('resultModal').classList.remove('hidden');
  card.classList.remove('animate-scale-in'); void card.offsetWidth; card.classList.add('animate-scale-in');
  lucide.createIcons({ nodes: [card] });
  $('closeBtn').focus();
  const close = () => $('resultModal').classList.add('hidden');
  $('closeX').onclick = close; $('closeBtn').onclick = close;
}
$('resultModal').onclick = (e) => { if (e.target.id === 'resultModal') e.target.classList.add('hidden'); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('resultModal').classList.add('hidden'); });

loadCatalog().then(renderCart);
</script>
</body>
</html>
